[package]
name = "inkline"
# Cosmetic only — Cargo requires a version here, but the version that
# actually ships in the installer/app comes from tauri.conf.json's
# "version": "../package.json" reference, which is the real source of truth.
version = "1.0.0"
description = "A local-first writing editor. Open it, start writing, everything saves automatically on your device."
authors = ["Inkline contributors"]
license = "MIT"
repository = "https://github.com/hamshamb/inkline"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "inkline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
