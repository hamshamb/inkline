<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="%PRODUCT_DESCRIPTION%" />
    <meta name="theme-color" content="#09090b" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>%PRODUCT_NAME%</title>
    <script>
      // Applies the last-known theme before React mounts, avoiding a flash
      // of the wrong theme. This reads only a cached UI preference (light
      // or dark), never document content, from localStorage — the actual
      // settings source of truth is IndexedDB, corrected right after load.
      ;(function () {
        try {
          var cached = localStorage.getItem('inkline-theme-cache')
          var theme = cached === 'light' || cached === 'dark'
            ? cached
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        } catch {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="print-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
